<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" fill="none">
  <defs>
    <filter id="mist" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="washTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c17f59" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c17f59" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c17f59" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c17f59" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b8f71" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#6b8f71" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- top mist wash -->
  <rect x="0" y="0" width="390" height="320" fill="url(#washTop)" filter="url(#mist)"/>
  <path d="M0 180 Q120 120 220 160 T390 140" stroke="#c17f59" stroke-opacity="0.22" stroke-width="1.5" fill="none"/>
  <path d="M0 240 Q100 200 200 230 T390 210" stroke="#6b8f71" stroke-opacity="0.18" stroke-width="1.2" fill="none"/>
  <!-- distant peaks -->
  <path d="M-10 520 Q80 380 160 460 T330 420 L390 480 L390 844 L-10 844Z" fill="url(#mountFar)" filter="url(#mist)"/>
  <path d="M0 580 Q120 440 210 520 T390 500 L390 844 L0 844Z" fill="url(#mountMid)" filter="url(#mist)"/>
  <path d="M0 560 Q95 430 195 510 T390 490" stroke="#c17f59" stroke-opacity="0.55" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M30 600 Q140 520 230 560 T370 540" stroke="#6b8f71" stroke-opacity="0.45" stroke-width="1.8" fill="none"/>
  <g stroke="#6b8f71" stroke-linecap="round">
    <line x1="320" y1="480" x2="320" y2="680" stroke-width="2.2" stroke-opacity="0.5"/>
    <line x1="338" y1="500" x2="338" y2="700" stroke-width="1.6" stroke-opacity="0.35"/>
    <path d="M300 540 Q330 520 350 545" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>
    <path d="M305 580 Q335 560 355 585" stroke-width="1.2" stroke-opacity="0.35" fill="none"/>
  </g>
  <rect x="48" y="620" width="72" height="72" rx="4" stroke="#c17f59" stroke-opacity="0.35" stroke-width="1.5" fill="#fffef8" fill-opacity="0.25"/>
</svg>
