<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" fill="none">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <radialGradient id="skyTop" cx="0.55" cy="0.02" r="1.0">
      <stop offset="0" stop-color="#bcd9ea" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d8eaf4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#eef7fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skySide" cx="0.02" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#cfe6f2" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#eef7fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmBot" cx="0.8" cy="0.98" r="0.7">
      <stop offset="0" stop-color="#f6dbe4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fdf3f6" stop-opacity="0"/>
    </radialGradient>
    <!-- белое соцветие: лепестки бело-розовые, сердцевина розовая -->
    <g id="bloom">
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#fdf2f5"/>
      <ellipse cx="6.7" cy="-2.2" rx="4.6" ry="7" fill="#fdf2f5" transform="rotate(72)"/>
      <ellipse cx="4.1" cy="5.8" rx="4.6" ry="7" fill="#fdf2f5" transform="rotate(144)"/>
      <ellipse cx="-4.1" cy="5.8" rx="4.6" ry="7" fill="#fdf2f5" transform="rotate(216)"/>
      <ellipse cx="-6.7" cy="-2.2" rx="4.6" ry="7" fill="#fdf2f5" transform="rotate(288)"/>
      <circle r="2.2" fill="#d97b95"/>
    </g>
    <g id="bloomSoft">
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#f7dce4"/>
      <ellipse cx="6.7" cy="-2.2" rx="4.6" ry="7" fill="#f7dce4" transform="rotate(72)"/>
      <ellipse cx="4.1" cy="5.8" rx="4.6" ry="7" fill="#f7dce4" transform="rotate(144)"/>
      <ellipse cx="-4.1" cy="5.8" rx="4.6" ry="7" fill="#f7dce4" transform="rotate(216)"/>
      <ellipse cx="-6.7" cy="-2.2" rx="4.6" ry="7" fill="#f7dce4" transform="rotate(288)"/>
      <circle r="2.2" fill="#c45c79"/>
    </g>
    <g id="leaf">
      <path d="M0 0 C6 -8 16 -10 22 -4 C14 -2 8 2 0 0 Z" fill="#8fb87a"/>
    </g>
  </defs>
  <rect width="390" height="844" fill="url(#skyTop)"/>
  <rect width="390" height="844" fill="url(#skySide)"/>
  <rect width="390" height="844" fill="url(#warmBot)"/>

  <!-- чернильные ветки наискось -->
  <g transform="translate(0 80)"><g stroke="#3a2e33" fill="none" stroke-linecap="round" filter="url(#soft2)">
