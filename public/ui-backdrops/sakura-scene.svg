    <circle cx="335" cy="72" r="44" fill="#fdeef3" fill-opacity="0.75"/>
    <circle cx="300" cy="112" r="30" fill="#f7dce4" fill-opacity="0.55"/>
    <circle cx="364" cy="120" r="26" fill="#fdeef3" fill-opacity="0.7"/>
    <circle cx="242" cy="86" r="22" fill="#fdf2f5" fill-opacity="0.6"/>
    <circle cx="212" cy="196" r="19" fill="#f4cbd8" fill-opacity="0.45"/>
    <circle cx="154" cy="238" r="15" fill="#fdeef3" fill-opacity="0.6"/>
    <circle cx="120" cy="392" r="16" fill="#f4cbd8" fill-opacity="0.4"/>
  </g>

  <!-- зелёные листья у ветвей -->
  <use href="#leaf" transform="translate(330 118) scale(0.9) rotate(-15)"/>
  <use href="#leaf" transform="translate(288 152) scale(0.8) rotate(160)"/>
  <use href="#leaf" transform="translate(226 84) scale(0.85) rotate(30)"/>
  <use href="#leaf" transform="translate(258 232) scale(0.7) rotate(-140)"/>
  <use href="#leaf" transform="translate(158 328) scale(0.75) rotate(-30)"/>
  <use href="#leaf" transform="translate(120 380) scale(0.65) rotate(170)"/>
  <use href="#leaf" transform="translate(358 96) scale(0.9) rotate(195)"/>
  <use href="#leaf" transform="translate(190 222) scale(0.6) rotate(80)"/>

  <!-- чёткие цветы -->
  </g>

  <!-- падающие лепестки -->
