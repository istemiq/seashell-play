    <circle cx="342" cy="72" r="3" fill="#d97b95" fill-opacity="0.7"/>
    <circle cx="322" cy="102" r="2.4" fill="#c45c79" fill-opacity="0.6"/>
    <circle cx="292" cy="128" r="2.2" fill="#d97b95" fill-opacity="0.55"/>
    <circle cx="252" cy="96" r="2" fill="#c45c79" fill-opacity="0.5"/>
