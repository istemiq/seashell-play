    <path d="M288 108 C264 172 218 258 162 332 C132 372 102 406 72 436" stroke-opacity="0.68" stroke-width="2.8"/>
    <path d="M340 58 C306 48 270 45 234 52 C218 55 202 60 190 68" stroke-opacity="0.6" stroke-width="2.2"/>
    <path d="M256 150 C272 178 280 208 276 238" stroke-opacity="0.5" stroke-width="1.8"/>
    <path d="M162 332 C150 352 144 374 146 394" stroke-opacity="0.42" stroke-width="1.6"/>
    <path d="M184 208 C172 203 156 203 144 209" stroke-opacity="0.4" stroke-width="1.6"/>
