    <ellipse cx="322" cy="480" rx="3.5" ry="6.5" fill-opacity="0.35" transform="rotate(60 322 480)"/>
    <ellipse cx="120" cy="700" rx="4" ry="7" fill-opacity="0.4" transform="rotate(25 120 700)"/>
    <ellipse cx="300" cy="660" rx="3.5" ry="6.5" fill-opacity="0.35" transform="rotate(-15 300 660)"/>
    <ellipse cx="60" cy="300" rx="3.5" ry="7" fill-opacity="0.35" transform="rotate(70 60 300)"/>
