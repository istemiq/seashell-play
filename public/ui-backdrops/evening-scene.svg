<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" fill="none">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8a849" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#e8a849" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8a849" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a849" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1020" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- top sky glow -->
  <ellipse cx="195" cy="160" rx="160" ry="100" fill="#e8a849" fill-opacity="0.12" filter="url(#glow)"/>
  <path d="M0 120 Q195 80 390 120" stroke="#e8a849" stroke-opacity="0.2" stroke-width="1.5" fill="none"/>
  <!-- sunset disk -->
  <circle cx="195" cy="520" r="70" fill="url(#sun)" filter="url(#glow)"/>
  <!-- layered mountains -->
  <path d="M-20 560 L90 420 L195 500 L290 400 L410 480 L410 844 L-20 844Z" fill="url(#peak)" filter="url(#glow)"/>
  <path d="M-10 600 L110 480 L200 540 L310 460 L400 520 L400 844 L-10 844Z" fill="#0c0812" fill-opacity="0.55"/>
  <path d="M0 620 L120 520 L210 570 L300 500 L390 550" stroke="#e8a849" stroke-opacity="0.55" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M40 660 L150 580 L230 620 L320 560" stroke="#e8a849" stroke-opacity="0.32" stroke-width="1.4" fill="none"/>
  <!-- pine silhouettes -->
  <g fill="#e8a849" fill-opacity="0.22" stroke="#e8a849" stroke-opacity="0.4" stroke-width="1.2">
    <path d="M48 680 L58 640 L68 680 Z"/>
    <path d="M72 700 L84 655 L96 700 Z"/>
    <path d="M310 690 L322 645 L334 690 Z"/>
  </g>
  <!-- mist band -->
  <ellipse cx="195" cy="640" rx="220" ry="40" fill="#e8a849" fill-opacity="0.08" filter="url(#glow)"/>
</svg>
