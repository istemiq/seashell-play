# В http { } блоке /etc/nginx/nginx.conf — без этого gzip только для text/html,
# а JS (~1 MB) уходит несжатым → Mini App «зависает» на seashell в деревне/3G.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  application/json
  application/javascript
  text/javascript
  application/xml
  text/xml
  image/svg+xml;
