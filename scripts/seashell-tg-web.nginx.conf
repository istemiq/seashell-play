server {
    server_name front.sishel.ru;
    root /var/www/seashell-tg;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/front.sishel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/front.sishel.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = front.sishel.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name front.sishel.ru;
    return 404;
}
