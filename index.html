<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=5, user-scalable=yes, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f6fa" />
    <meta
      name="description"
      content="Seashell — language dictionary and AI practice (Google Play)"
    />
    <title>Seashell</title>
    <script>
      /*
       * Сторож загрузки фронта.
       *  1) Если бандл (хешированный файл в assets/) не скачался — модуль не выполняется, window.__seashellAppMounted
       *     не появляется, и приложение навсегда висит на «seashell». Пробуем один раз перезагрузить бандл
       *     с обходом кеша (лечит «index.html старый, assets уже перезалиты»), затем показываем экран.
       *  2) Если приложение так и не смонтировалось — показываем понятный текст + диагностику
       *     (stage, entry, последняя ошибка), чтобы причина была видна с телефона.
       */
      (function () {
        var boot = (window.__seashellBoot = window.__seashellBoot || { stage: 'html', errors: [] });
        var retried = false;

        function record(kind, detail) {
          try {
            boot.errors.push(kind + ': ' + String(detail == null ? '' : detail).slice(0, 180));
            if (boot.errors.length > 5) boot.errors.shift();
          } catch (e) {
            /* ignore */
          }
        }

        function appAlive() {
          return Boolean(window.__seashellAppMounted || boot.mounted);
        }

        function entrySrc() {
          var el = document.querySelector('script[type="module"][src]');
          return el ? el.getAttribute('src') || '' : '';
        }

        function describe() {
          var parts = ['stage=' + (boot.stage || 'html')];
          var src = entrySrc();
          if (src) parts.push('entry=' + src);
          if (boot.errors.length) parts.push(boot.errors[boot.errors.length - 1]);
          return parts.join(' | ');
        }

        function showBootScreen(fatal) {
          if (appAlive() || boot.htmlScreen) return;
          if (!document.body) {
            document.addEventListener('DOMContentLoaded', function () {
              showBootScreen(fatal);
            });
            return;
          }
          var root = document.getElementById('root');
          if (!root || !root.querySelector('.boot-loader')) return;
          boot.htmlScreen = fatal ? 'fatal' : 'slow';
          root.innerHTML =
            '<div class="boot-loader" style="padding:24px;box-sizing:border-box;font-family:system-ui,sans-serif;text-align:center;line-height:1.5">' +
            '<p style="margin:0 0 12px;opacity:.85">' +
            (fatal ? 'Не удалось загрузить приложение.' : 'Приложение долго загружается.') +
            '</p>' +
            '<p style="margin:0 0 16px;font-size:0.95rem;opacity:.65">Проверьте интернет и полностью закройте приложение, затем откройте снова.</p>' +
            '<button type="button" onclick="location.reload()" style="padding:10px 18px;border:1px solid rgba(127,127,127,.4);border-radius:8px;background:transparent;font:inherit">Перезагрузить</button>' +
            '<p style="margin:16px 0 0;font-size:11px;opacity:.45;word-break:break-word">' +
            describe() +
            '</p>' +
            '</div>';
        }

        /** Одна повторная загрузка бандла с обходом кеша. */
        function retryEntry(reason) {
          if (retried || appAlive()) return;
          var src = entrySrc();
          if (!src) return;
          retried = true;
          record('retry', reason);
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = src + (src.indexOf('?') >= 0 ? '&' : '?') + 'retry=' + Date.now();
          s.onerror = function () {
            record('retry-failed', s.src);
            showBootScreen(true);
          };
          document.head.appendChild(s);
        }

        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target;
            if (target && target !== window && target.tagName === 'SCRIPT') {
              var src = target.getAttribute('src') || '';
              record('script-error', src);
              if (src && src === entrySrc()) retryEntry('entry load failed');
              return;
            }
            if (typeof ErrorEvent !== 'undefined' && event instanceof ErrorEvent) {
              record('error', event.message);
            }
          },
          true,
        );

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          record('rejection', (reason && reason.message) || reason);
        });

        window.setTimeout(function () {
          showBootScreen(false);
        }, 20000);
        window.setTimeout(function () {
          showBootScreen(false);
        }, 50000);
      })();
    </script>
    <script>
      (function () {
        var theme = 'light';
        var locale = 'en';
        var rtlLocales = { ar: 1, fa: 1 };
        try {
          var s = JSON.parse(localStorage.getItem('seashell_settings_v1') || '{}');
          var pref = s.theme || 'system';
          if (pref === 'dark') theme = 'dark';
          else if (pref === 'light') theme = 'light';
          else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            theme = 'dark';
          }
          if (s.uiLocale && typeof s.uiLocale === 'string') {
            locale = s.uiLocale;
          }
        } catch (e) {
          /* ignore */
        }
        document.documentElement.dataset.seashellTheme = theme;
        document.documentElement.lang = locale;
        document.documentElement.dir = rtlLocales[locale] ? 'rtl' : 'ltr';
      })();
    </script>
    <style>
      html {
        color-scheme: light;
      }

      html[data-seashell-theme='dark'] {
        color-scheme: dark;
      }

      html,
      body,
      #root,
      html {
        font-size: 17px;
      }

      .boot-loader {
        min-height: 100%;
        height: 100%;
        margin: 0;
        background: #f4f6fa;
        overflow: hidden;
        max-width: 100%;
      }

      html[data-seashell-theme='dark'],
      html[data-seashell-theme='dark'] body,
      html[data-seashell-theme='dark'] #root,
      html[data-seashell-theme='dark'] .boot-loader {
        background: #0a0e14;
      }

      .boot-loader {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .boot-shimmer {
        font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;
        font-size: clamp(1.05rem, 4.5vw, 1.45rem);
        font-weight: 400;
        letter-spacing: 0.04em;
        opacity: 0.82;
        background: linear-gradient(
          90deg,
          rgba(90, 102, 120, 0.35) 0%,
          rgba(60, 72, 96, 0.72) 35%,
          rgba(40, 52, 72, 0.82) 50%,
          rgba(80, 92, 112, 0.5) 70%,
          rgba(110, 120, 140, 0.28) 100%
        );
        background-size: 250% auto;
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        animation: boot-shimmer-sweep 2.6s linear infinite;
        white-space: pre;
        direction: ltr;
      }

      html[data-seashell-theme='dark'] .boot-shimmer {
        background: linear-gradient(
          90deg,
          rgba(170, 180, 195, 0.28) 0%,
          rgba(230, 240, 255, 0.72) 35%,
          rgba(255, 255, 255, 0.78) 50%,
          rgba(200, 210, 225, 0.45) 70%,
          rgba(150, 160, 175, 0.22) 100%
        );
        background-size: 250% auto;
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }

      @keyframes boot-shimmer-sweep {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-shimmer {
          animation: none;
          color: #5a6678;
          background: none;
        }

        html[data-seashell-theme='dark'] .boot-shimmer {
          color: #d1d9e6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Loading">
        <span class="boot-shimmer" aria-hidden="true">seashell</span>
      </div>
    </div>
    <script>
      (function () {
        var el = document.querySelector('.boot-shimmer');
        if (!el) return;
        if (
          window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          return;
        }
        var dots = 0;
        window.setInterval(function () {
          dots = dots >= 3 ? 0 : dots + 1;
          el.textContent = 'seashell' + '.'.repeat(dots);
        }, 2600);
      })();
    </script>
    <!-- Сторож загрузки перенесён в <head> (см. скрипт с window.__seashellBoot): он должен ловить
         ошибку загрузки бандла раньше, чем она станет необратимой. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
